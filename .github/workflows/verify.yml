# HCS quality-gate CI.
#
# Runs `just verify` — the full gate suite the Definition of Done already assumes
# (lint/typecheck/test + ring boundary-check, schema-drift, policy-lint,
# snapshot-binding, forbidden-string-scan, identity-scan, no-live-secrets,
# no-runtime-state, shellcheck, and the regression fixtures). This wires the
# enforcement that AGENTS.md / README ("enforced by CI from commit 1") describe.
#
# Runner = macos-latest on purpose: scripts/ci/verify.sh and its sub-scripts
# assume macOS/bash (BSD find, system Ruby for snapshot-binding-check, etc.), and
# the local-only CredentialSource sandbox false-positive does not occur on a
# clean runner. Tracked follow-ups: (1) Ubuntu portability so the cheaper runner
# can be used, (2) pin actions to commit SHAs (supply-chain hardening).
name: verify

on:
  pull_request:
  push:
  workflow_dispatch:

# Cancel superseded runs on the same ref (saves macOS minutes).
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the gates only read the tree.
permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up mise toolchain (.mise.toml — node 24, just, shellcheck, shfmt)
        uses: jdx/mise-action@v2

      # The macOS runner's default /bin/bash is 3.2.57; HCS gate scripts use
      # bash 4+ features (declare -A associative arrays, process substitution).
      # Provision Homebrew bash 5.x and put it first on PATH so `just` recipes
      # run under modern bash, matching the dev environment. No script changes.
      - name: Provision modern bash (runner default is bash 3.2)
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          bash --version | head -1

      # mise which bypasses PATH/shims; check mise exec selection after brew's
      # PATH update, then retain the absolute prepared interpreter for Git prep.
      - name: Bind prepared Python after runner PATH setup
        id: manifest_python
        env:
          MISE_EXEC_AUTO_INSTALL: "0"
        run: |
          python_path="$(mise which python)"
          HCS_MANIFEST_EXPECTED_PYTHON="$python_path" mise exec -- python3 -I -S -B scripts/ci/prepare-manifest-git.py --check-runtime
          printf 'python=%s\n' "$python_path" >> "$GITHUB_OUTPUT"

      # Pinned source/checksum; isolated prefix under RUNNER_TEMP. The helper
      # requires existing macOS system make/clang and the HCS Python pin.
      # Qualification is this job's actual result, not a portability claim.
      - name: Prepare native Git 2.56 for manifest observation
        id: manifest_git
        env:
          HCS_MANIFEST_PYTHON: ${{ steps.manifest_python.outputs.python }}
        run: '"$HCS_MANIFEST_PYTHON" -I -S -B scripts/ci/prepare-manifest-git.py'

      - name: Install Node dependencies (npm ci)
        run: npm ci

      - name: Run all quality gates (just verify)
        env:
          # Skip host-coupled direnv/mise/Codex probe fixtures — they inspect the
          # dev workstation, not a clean runner. See scripts/ci/verify.sh.
          HCS_SKIP_HOST_FIXTURES: "1"
          HCS_MANIFEST_GIT: ${{ steps.manifest_git.outputs.git }}
          MISE_EXEC_AUTO_INSTALL: "0"
        run: mise exec -- just verify
