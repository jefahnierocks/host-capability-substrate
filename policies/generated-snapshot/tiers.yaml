  accepted_human_decisions_record: "docs/host-capability-substrate/2026-05-12-phase-2-5-reviewer-resolution-packet.md#human-decisions-resolved-2026-05-12"
  approved_by: jeffreyverlynjohnson@gmail.com
  approved_at: "2026-05-18T17:10:15Z"

snapshot_binding:
  source_policy_sha256: "sha256:26ebf6a5f77cca3e92317c21ede1d18a1671eed2d8756e4c9fb14f9e1af87614"
  source_policy_sha256_basis: candidate_source_blob_at_system_config_commit_63309b3
  hcs_snapshot_status: not_vendored

schema_refs:
  operation_shape_schema_version: "0.2.0"
  decision_schema_version: "0.1.0"
  approval_grant_schema_version: "0.1.0"
  lease_schema_version: "0.1.0"
  run_schema_version: "0.1.0"
  principal_schema_version: "0.1.0"
  session_schema_version: "0.1.0"
  policy_rule_schema_version: null

evidence_refs:
  source_adr_refs:
    - "hcs:docs/host-capability-substrate/adr/0049-decision-ring-0-entity.md"
    - "hcs:docs/host-capability-substrate/adr/0051-approval-grant-ring-0-entity.md"
    - "hcs:docs/host-capability-substrate/adr/0052-lease-ring-0-entity.md"
    - "hcs:docs/host-capability-substrate/adr/0053-run-ring-0-entity.md"
    - "hcs:docs/host-capability-substrate/adr/0054-principal-ring-0-entity.md"
