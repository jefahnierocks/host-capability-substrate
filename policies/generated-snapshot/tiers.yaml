  grants_execution_authority: false
  canonical_path: policies/host-capability-substrate/tiers.yaml
  activation_path: hcs_unblock_fast
  activation_scope: minimal_live_policy_with_current_stub_lint
  post_activation_pending_work:
    - live_policy_lint_expansion
    - negative_test_fixtures
    - hcs_generated_snapshot_vendoring

classification_authority:
  primary_classification_surface: typed_operation_class
  primary_classification_enum_ref: "hcs:packages/schemas/src/entities/operation-shape.ts#operationShapeOperationClassSchema"
  shell_regex_primary_classification_allowed: false
  renderer_hook_lint_backstop_allowed: true
  notes: >
    Primary policy classification is the closed OperationShape.operation_class
    enum. Regex patterns are defense-in-depth for renderers, hooks, and lint
    only; they do not define primary operation intent.

provenance:
  hcs_source_repo: jefahnierocks/host-capability-substrate
  hcs_source_commit: 83b24eb
  hcs_source_refreshed_at: "2026-05-18"
